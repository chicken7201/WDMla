name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v2.8.1-gtnh656.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Select release JAR
        id: artifact
        shell: bash
        run: |
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              ! -name '*-api.jar' \
              | sort
          )

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, but found ${#jars[@]}:"
            printf '  %s\n' "${jars[@]}"
            exit 1
          fi

          echo "jar=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "Selected release artifact: ${jars[0]}"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_JAR: ${{ steps.artifact.outputs.jar }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading the rebuilt JAR."
            gh release upload "$RELEASE_TAG" "$RELEASE_JAR" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
